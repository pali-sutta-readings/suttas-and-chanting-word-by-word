<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010">
  <style>
    text { font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #1f2937; }
    .title { font-size: 26px; font-weight: bold; }
    .lane { font-size: 15px; font-weight: bold; fill: #4b5563; letter-spacing: 1.5px; }
    .h { font-size: 16px; font-weight: bold; }
    .s { font-size: 13px; fill: #374151; }
    .c { font-family: 'Noto Sans Mono', 'DejaVu Sans Mono', monospace; }
    .note { font-size: 13px; fill: #4b5563; font-style: italic; }
    .band { fill: #fafafa; stroke: #e5e7eb; stroke-width: 1.5; }
    .script { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8; }
    .data { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.8; }
    .tool { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.8; }
    .api { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.8; }
    .skill { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.8; }
    .out { fill: #fef9c3; stroke: #ca8a04; stroke-width: 1.8; }
    .arrow { fill: none; stroke: #374151; stroke-width: 1.8; marker-end: url(#a); }
    .dash { fill: none; stroke: #6b7280; stroke-width: 1.6; stroke-dasharray: 6 4; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1500" height="1010" fill="#ffffff"/>

  <text x="30" y="42" class="title">Build and check flow</text>

  <!-- ============================ BUILD ============================ -->
  <rect x="15" y="60" width="1470" height="345" rx="10" class="band"/>
  <text x="30" y="84" class="lane">BUILD · make all · make book BOOK=&lt;id&gt;</text>

  <!-- book folder -->
  <rect x="30" y="190" width="220" height="140" rx="8" class="data"/>
  <text x="45" y="216" class="h c">books/&lt;book&gt;/</text>
  <text x="45" y="244" class="s c">metadata.txt</text>
  <text x="45" y="266" class="s c">00_about.md</text>
  <text x="45" y="288" class="s c">texts/NN_*.md</text>
  <text x="45" y="314" class="note">title, sources, rights, parts</text>

  <!-- assemble -->
  <rect x="300" y="222" width="180" height="76" rx="8" class="script"/>
  <text x="315" y="250" class="h c">assemble.py</text>
  <text x="315" y="272" class="s">parses each text once;</text>
  <text x="315" y="289" class="s">warns on lint errors</text>

  <!-- assembled md -->
  <rect x="530" y="205" width="220" height="110" rx="8" class="data"/>
  <text x="545" y="232" class="h c">build/tmp/</text>
  <text x="545" y="256" class="s c">&lt;book&gt;.md</text>
  <text x="545" y="276" class="s c">&lt;book&gt;.pandoc.json</text>
  <text x="545" y="300" class="note">one source, two formats</text>

  <!-- cover row -->
  <rect x="530" y="95" width="220" height="56" rx="8" class="data"/>
  <text x="545" y="119" class="h c">cover.json</text>
  <text x="545" y="140" class="s">text from metadata.txt</text>
  <rect x="800" y="95" width="230" height="56" rx="8" class="tool"/>
  <text x="815" y="119" class="h">typst</text>
  <text x="815" y="140" class="s c">templates/typst/cover.typ</text>
  <rect x="1080" y="95" width="180" height="56" rx="8" class="out"/>
  <text x="1095" y="119" class="h">cover PNG</text>
  <text x="1095" y="140" class="s c">build/covers/</text>

  <!-- EPUB row -->
  <rect x="800" y="192" width="230" height="60" rx="8" class="tool"/>
  <text x="815" y="216" class="h">pandoc → EPUB</text>
  <text x="815" y="238" class="s">epub.css · embedded fonts</text>
  <rect x="1080" y="192" width="180" height="60" rx="8" class="tool"/>
  <text x="1095" y="216" class="h">epubcheck</text>
  <text x="1095" y="238" class="s">fails the build on errors</text>
  <rect x="1300" y="192" width="170" height="60" rx="8" class="out"/>
  <text x="1315" y="216" class="h c">build/epub/</text>
  <text x="1315" y="238" class="s c">&lt;book&gt;.epub</text>

  <!-- PDF row -->
  <rect x="800" y="300" width="230" height="76" rx="8" class="tool"/>
  <text x="815" y="324" class="h">pandoc → typst</text>
  <text x="815" y="346" class="s c">templates/pandoc/chant.lua</text>
  <text x="815" y="364" class="s c">templates/pandoc/book.typst</text>
  <rect x="1080" y="300" width="180" height="76" rx="8" class="tool"/>
  <text x="1095" y="324" class="h">typst compile</text>
  <text x="1095" y="346" class="s">A5; cover as page 1;</text>
  <text x="1095" y="364" class="s">only fonts/ used</text>
  <rect x="1300" y="300" width="170" height="76" rx="8" class="out"/>
  <text x="1315" y="324" class="h c">build/pdf/</text>
  <text x="1315" y="346" class="s c">&lt;book&gt;.pdf</text>

  <!-- build arrows -->
  <path d="M250,260 L298,260" class="arrow"/>
  <path d="M480,260 L528,260" class="arrow"/>
  <path d="M390,222 L390,123 L528,123" class="arrow"/>
  <text x="398" y="168" class="s c">--cover-data</text>
  <path d="M750,123 L798,123" class="arrow"/>
  <path d="M1030,123 L1078,123" class="arrow"/>
  <path d="M750,235 L798,222" class="arrow"/>
  <path d="M750,295 L798,330" class="arrow"/>
  <path d="M1030,222 L1078,222" class="arrow"/>
  <path d="M1260,222 L1298,222" class="arrow"/>
  <path d="M1030,338 L1078,338" class="arrow"/>
  <path d="M1260,338 L1298,338" class="arrow"/>
  <path d="M1120,151 L1000,190" class="dash"/>
  <text x="1095" y="180" class="note">EPUB cover</text>

  <!-- ============================ CHECKS ============================ -->
  <rect x="15" y="425" width="1470" height="500" rx="10" class="band"/>
  <text x="30" y="449" class="lane">CHECKS · docs/quality-process.md</text>

  <!-- all texts -->
  <rect x="30" y="470" width="200" height="390" rx="8" class="data"/>
  <text x="45" y="498" class="h">all texts</text>
  <text x="45" y="522" class="s c">books/*/texts/</text>
  <text x="45" y="542" class="s c">books/09_…/0N_*/</text>
  <text x="45" y="574" class="note">209 chant files</text>

  <!-- column headings -->
  <text x="290" y="476" class="note">script (make target) and what it reads</text>
  <text x="740" y="476" class="note">report</text>
  <text x="1070" y="476" class="note">judged by</text>

  <!-- row 1: lint -->
  <rect x="290" y="488" width="390" height="76" rx="8" class="script"/>
  <text x="305" y="514" class="h"><tspan class="c">lint.py</tspan>   <tspan class="s c">make lint · lint-fix</tspan></text>
  <text x="305" y="538" class="s">rule lists from <tspan class="c">docs/style-spec.md</tspan></text>
  <text x="305" y="556" class="s">layout, tags, characters, repeats</text>
  <rect x="740" y="494" width="270" height="64" rx="8" class="out"/>
  <text x="755" y="520" class="h">ERROR · STRAY · WARN</text>
  <text x="755" y="542" class="s">per file and line</text>
  <rect x="1070" y="494" width="400" height="64" rx="8" class="skill"/>
  <text x="1085" y="520" class="h">editor or agent</text>
  <text x="1085" y="542" class="s">fix to 0 ERROR, 0 STRAY; every WARN explained</text>

  <!-- row 2: compare -->
  <rect x="290" y="584" width="390" height="76" rx="8" class="script"/>
  <text x="305" y="610" class="h"><tspan class="c">compare.py</tspan>   <tspan class="s c">make compare</tspan></text>
  <text x="305" y="634" class="s"><tspan class="c">sources/ref-map.tsv</tspan>, <tspan class="c">sources/upstream/</tspan></text>
  <rect x="305" y="641" width="196" height="16" rx="4" class="api"/>
  <text x="311" y="654" class="s" style="font-size:11.5px">Simsapa: SuttaCentral texts</text>
  <rect x="740" y="590" width="270" height="64" rx="8" class="out"/>
  <text x="755" y="616" class="h">Pāli differences</text>
  <text x="755" y="638" class="s">our line vs the source</text>
  <rect x="1070" y="590" width="400" height="64" rx="8" class="skill"/>
  <text x="1085" y="616" class="h">source-compare skill</text>
  <text x="1085" y="638" class="s">classifies each difference; Pāli doubts → maintainer</text>

  <!-- row 3: index -->
  <rect x="290" y="680" width="390" height="76" rx="8" class="script"/>
  <text x="305" y="706" class="h"><tspan class="c">index.py</tspan>   <tspan class="s c">make index</tspan></text>
  <text x="305" y="730" class="s">every word row across all texts</text>
  <text x="305" y="748" class="s">(also <tspan class="c">rows</tspan>, <tspan class="c">overlaps</tspan> for drafting)</text>
  <rect x="740" y="686" width="270" height="64" rx="8" class="out"/>
  <text x="755" y="712" class="h">consistency report</text>
  <text x="755" y="734" class="s">same word, other etymology or tags</text>
  <rect x="1070" y="686" width="400" height="64" rx="8" class="skill"/>
  <text x="1085" y="712" class="h">dpd-review skill</text>
  <text x="1085" y="734" class="s">bulk fixes with <tspan class="c">align.py</tspan> (dry run, then --apply)</text>

  <!-- row 4: dpd-check -->
  <rect x="290" y="776" width="390" height="84" rx="8" class="script"/>
  <text x="305" y="802" class="h"><tspan class="c">simsapa.py check</tspan>   <tspan class="s c">make dpd-check</tspan></text>
  <rect x="305" y="812" width="250" height="18" rx="4" class="api"/>
  <text x="311" y="826" class="s" style="font-size:11.5px">Simsapa: <tspan class="c">POST /lookup_forms</tspan> (DPD)</text>
  <text x="305" y="850" class="s">hides items in <tspan class="c">checks/dpd-review.tsv</tspan></text>
  <rect x="740" y="786" width="270" height="64" rx="8" class="out"/>
  <text x="755" y="812" class="h">FLAG · CANDIDATE</text>
  <text x="755" y="834" class="s">root, etymology, grammar, not found</text>
  <rect x="1070" y="786" width="400" height="64" rx="8" class="skill"/>
  <text x="1085" y="812" class="h">dpd-review skill</text>
  <text x="1085" y="834" class="s">one verdict per item: notation, homonym, dpd-gap …</text>

  <!-- check arrows -->
  <path d="M230,526 L288,526" class="arrow"/>
  <path d="M230,622 L288,622" class="arrow"/>
  <path d="M230,718 L288,718" class="arrow"/>
  <path d="M230,818 L288,818" class="arrow"/>
  <path d="M680,526 L738,526" class="arrow"/>
  <path d="M680,622 L738,622" class="arrow"/>
  <path d="M680,718 L738,718" class="arrow"/>
  <path d="M680,818 L738,818" class="arrow"/>
  <path d="M1010,526 L1068,526" class="arrow"/>
  <path d="M1010,622 L1068,622" class="arrow"/>
  <path d="M1010,718 L1068,718" class="arrow"/>
  <path d="M1010,818 L1068,818" class="arrow"/>
  <path d="M1270,850 L1270,895 L485,895 L485,862" class="dash"/>
  <text x="560" y="914" class="note">verdicts go to checks/dpd-review.tsv, so the next run shows only new items</text>

  <!-- legend -->
  <g transform="translate(30,950)">
    <rect width="26" height="18" rx="4" class="script"/><text x="34" y="14" class="s">script</text>
    <rect x="120" width="26" height="18" rx="4" class="tool"/><text x="154" y="14" class="s">external tool</text>
    <rect x="285" width="26" height="18" rx="4" class="api"/><text x="319" y="14" class="s">Simsapa localhost API</text>
    <rect x="490" width="26" height="18" rx="4" class="data"/><text x="524" y="14" class="s">files and data</text>
    <rect x="650" width="26" height="18" rx="4" class="out"/><text x="684" y="14" class="s">output or report</text>
    <rect x="830" width="26" height="18" rx="4" class="skill"/><text x="864" y="14" class="s">judgment: agent with a skill, or editor</text>
  </g>
  <text x="30" y="996" class="note">Every content change also gets a changelog entry in its folder's CHANGELOG.md.</text>
</svg>
